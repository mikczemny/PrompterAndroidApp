# Single source of truth for the app version.
#
# Read by app/build.gradle.kts, so the number lives in one place instead of
# being edited in the build script and forgotten in the release notes.
#
# VERSION_CODE must increase with every build uploaded to Play; it is what the
# store compares. VERSION_NAME is what people see.
VERSION_NAME=1.1.0
VERSION_CODE=3
